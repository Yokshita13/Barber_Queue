<!-- ═══════════════ LANDING ═══════════════ -->
<div class="screen active" id="s-land">

  <div class="scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:40px 24px;text-align:center;position:relative;overflow:hidden">

    <div class="glow-gold"></div>
    <div class="glow-cyan"></div>

    <div style="font-size:64px;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(245,200,66,.3))">✂️</div>

    <div style="font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;margin-bottom:10px;font-family:'Syne',sans-serif">
      Barber<span style="color:var(--gold)"> - Q</span>
    </div>

    <p style="color:var(--txt2);font-size:16px;max-width:260px;line-height:1.6;margin-bottom:48px">
      Skip the wait. Book your barber in real-time.
    </p>

    <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px">

      <button class="btn btn-gold btn-full" style="height:54px;font-size:16px" onclick="go('s-auth')">
        Get Started
      </button>

      <button class="btn btn-outline btn-full" style="height:54px;font-size:16px" onclick="demoAs('customer')">
        👤 Demo as Customer
      </button>

      <button class="btn btn-outline btn-full" style="height:54px;font-size:16px" onclick="demoAs('barber')">
        ✂️ Demo as Barber
      </button>

    </div>

    <div style="margin-top:52px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;width:100%;max-width:300px">

      <div>
        <div style="font-size:26px;font-weight:800;color:var(--gold);font-family:'Syne',sans-serif">2.4k+</div>
        <div style="font-size:12px;color:var(--txt2)">Barbers</div>
      </div>

      <div>
        <div style="font-size:26px;font-weight:800;color:var(--gold);font-family:'Syne',sans-serif">18k+</div>
        <div style="font-size:12px;color:var(--txt2)">Customers</div>
      </div>

      <div>
        <div style="font-size:26px;font-weight:800;color:var(--gold);font-family:'Syne',sans-serif">4.9★</div>
        <div style="font-size:12px;color:var(--txt2)">Rating</div>
      </div>

    </div>

  </div>
</div>
