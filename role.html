<!-- ═══════════════ ROLE ═══════════════ -->
<div class="screen" id="s-role">

  <div class="nav">
    <button class="nav-back" onclick="go('s-auth')">← Back</button>
    <span></span>
    <span></span>
  </div>

  <div class="scroll" style="display:flex;flex-direction:column;justify-content:center;padding:32px 24px">

    <div style="max-width:360px;width:100%;margin:0 auto">

      <div style="font-size:28px;font-weight:800;font-family:'Syne',sans-serif;margin-bottom:6px">
        Who are you?
      </div>

      <p style="color:var(--txt2);margin-bottom:36px;font-size:14px">
        Choose how you'd like to use Barber - Q
      </p>

      <div style="display:flex;flex-direction:column;gap:14px">

        <div class="glass"
        style="padding:24px;cursor:pointer;transition:all .2s;border:2px solid transparent"
        onclick="demoAs('customer')"
        onmouseenter="this.style.borderColor='var(--gold)'"
        onmouseleave="this.style.borderColor='transparent'">

          <div style="font-size:44px;margin-bottom:10px">👤</div>

          <div style="font-size:20px;font-weight:700;font-family:'Syne',sans-serif;margin-bottom:6px">
            Customer
          </div>

          <p style="color:var(--txt2);font-size:14px;line-height:1.5">
            Find nearby barbers, join queues remotely, and track your turn live.
          </p>

        </div>


        <div class="glass"
        style="padding:24px;cursor:pointer;transition:all .2s;border:2px solid transparent"
        onclick="demoAs('barber')"
        onmouseenter="this.style.borderColor='var(--cyan)'"
        onmouseleave="this.style.borderColor='transparent'">

          <div style="font-size:44px;margin-bottom:10px">✂️</div>

          <div style="font-size:20px;font-weight:700;font-family:'Syne',sans-serif;margin-bottom:6px">
            Barber / Shop Owner
          </div>

          <p style="color:var(--txt2);font-size:14px;line-height:1.5">
            Manage your live queue, track customers, and grow your business.
          </p>

        </div>

      </div>

    </div>

  </div>
</div>
