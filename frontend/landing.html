<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberQ: A Smart Digital Queue Management System</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="screen active" id="s-land">
    <div class="scroll landing-scroll">

      <div class="landing-content">

        <div class="landing-badge">
          <span class="status-dot"></span>
          YOUR NEXT FRESH LOOK STARTS HERE
        </div>

        <div class="landing-logo">✂️</div>

        <h1 class="landing-title">
          <!-- UniSalon<span>Q.</span> -->
          Glowora
        </h1>

        <p class="landing-tagline">
          Good hair. Great style. <br>
          <span>Zero waiting.</span>
        </p>

        <p class="landing-description">
          Find your barber, book your spot, and
          enjoy a smarter salon experience.
        </p>

        <div class="landing-actions">
          <button class="btn btn-gold btn-full landing-primary" onclick="go('s-auth')">
            Get Started <span>→</span>
          </button>

          <button class="btn btn-outline btn-full landing-secondary" onclick="demoAs('customer')">
            👤 &nbsp; Explore as Customer
          </button>

          <button class="btn btn-outline btn-full landing-secondary" onclick="demoAs('barber')">
            ✂️ &nbsp; Enter Barber Mode
          </button>
        </div>

        <div class="landing-footer">
          <span>✦ SMART QUEUE MANAGEMENT</span>
          <span>✦ BUILT FOR BETTER GROOMING</span>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="layout_fix.js"></script>

</body>

</html>
