<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Glowora · Support Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050719;
            --c: #0c1030;
            --c2: #10153d;
            --ln: rgba(120, 120, 255, .2);
            --mu: #98a1cc;
            --gold: #f5b73b
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            color: #eef1ff;
            font: 15px/1.45 'DM Sans', system-ui, sans-serif;
            background: radial-gradient(60% 40% at 90% 0%, rgba(124, 58, 237, .25), transparent 70%), radial-gradient(50% 40% at 0% 100%, rgba(245, 183, 59, .08), transparent 70%), var(--bg);
            min-height: 100vh
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--ln);
            background: rgba(5, 7, 25, .7);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 5
        }

        .logo {
            font: 800 22px 'Syne', sans-serif;
            color: var(--gold)
        }

        header span {
            color: var(--mu);
            font-size: 13px
        }

        .w {
            max-width: 980px;
            margin: 0 auto;
            padding: 22px 16px 70px
        }

        h1 {
            margin: 0 0 4px;
            font: 800 28px 'Syne', sans-serif
        }

        .sub {
            color: var(--mu);
            font-size: 13px;
            margin-bottom: 16px
        }

        .bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--ln);
            background: var(--c);
            color: inherit;
            font: inherit
        }

        .bar input {
            flex: 1;
            min-width: 220px;
            width: auto
        }

        .bar select {
            width: auto
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 14px;
            padding: 11px 20px;
            font: 700 14px 'DM Sans', sans-serif;
            color: #1a1200;
            background: linear-gradient(90deg, #f5b73b, #ff9a3d);
            box-shadow: 0 10px 24px -12px #f5b73b
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px
        }

        .stat {
            background: var(--c);
            border: 1px solid var(--ln);
            border-radius: 16px;
            padding: 12px 14px
        }

        .stat small {
            display: block;
            color: var(--mu);
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .stat strong {
            font: 800 24px 'Syne', sans-serif
        }

        .t {
            background: var(--c);
            border: 1px solid var(--ln);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .t h3 {
            margin: 0;
            font: 700 16px 'DM Sans', sans-serif
        }

        .m {
            font-size: 12.5px;
            color: var(--mu);
            margin-top: 3px
        }

        .st {
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid var(--k);
            color: var(--k);
            background: color-mix(in srgb, var(--k) 12%, transparent)
        }

        .d {
            margin: 10px 0;
            white-space: pre-wrap;
            color: #d6dbf6
        }

        .rp {
            margin: 8px 0 0;
            padding: 8px 12px;
            border-left: 3px solid var(--gold);
            background: rgba(245, 183, 59, .08);
            border-radius: 0 12px 12px 0;
            font-size: 14px
        }

        .rp small {
            display: block;
            color: var(--mu);
            margin-top: 2px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px
        }

        .row select {
            width: auto
        }

        .e {
            text-align: center;
            color: var(--mu);
            padding: 46px 0;
            background: var(--c);
            border: 1px solid var(--ln);
            border-radius: 20px
        }

        @media (max-width:560px) {
            .stats {
                grid-template-columns: 1fr 1fr 1fr
            }

            .stat strong {
                font-size: 20px
            }
        }
    </style>
</head>

<body>
    <header><span class="logo">Glowora</span><span>Support Desk</span></header>
    <div class="w">
        <h1>Customer tickets</h1>
        <div class="sub">Reply here — customers see your answer under Help &amp; Support → My Tickets, and the shop sees
            tickets about their own shop.</div>
        <div class="bar">
            <input id="key" type="password" placeholder="Admin key (ADMIN_KEY on Render)">
            <select id="flt">
                <option value="">All</option>
                <option>Open</option>
                <option>In progress</option>
                <option>Resolved</option>
            </select>
            <button id="go">Load tickets</button>
        </div>
        <div class="stats" id="stats"></div>
        <div id="list">
            <div class="e">Enter your admin key and press Load tickets.</div>
        </div>
    </div>
    <script>
        const BQ_BASE = "https://barber-queue-backend-9z52.onrender.com";   // same as script.js
        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const COL = { "Open": "#f5b73b", "In progress": "#6aa8ff", "Resolved": "#34d399" };
        try { $("key").value = sessionStorage.getItem("adminKey") || ""; } catch (e) { }
        async function api(path, opt = {}) {
            const r = await fetch(BQ_BASE + path, { ...opt, headers: { "Content-Type": "application/json", "X-Admin-Key": $("key").value.trim(), ...(opt.headers || {}) } });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || j.success === false) throw new Error(j.error || "Request failed");
            return j;
        }
        async function load() {
            $("list").innerHTML = '<div class="e">Loading…</div>';
            try {
                try { sessionStorage.setItem("adminKey", $("key").value.trim()); } catch (e) { }
                const f = $("flt").value;
                const j = await api("/api/admin/tickets" + (f ? "?status=" + encodeURIComponent(f) : ""));
                const c = s => j.tickets.filter(t => t.status === s).length;
                $("stats").innerHTML = ["Open", "In progress", "Resolved"].map(s => `<div class="stat"><small>${s}</small><strong style="color:${COL[s]}">${c(s)}</strong></div>`).join("");
                $("list").innerHTML = j.tickets.length ? j.tickets.map(card).join("") : '<div class="e">No tickets 🎉</div>';
            } catch (e) { $("stats").innerHTML = ""; $("list").innerHTML = '<div class="e">' + esc(e.message) + '</div>'; }
        }
        function card(t) {
            return `<div class="t" data-id="${t.id}">
    <div class="top"><h3>${esc(t.ref)} · ${esc(t.subject)}</h3><span class="st" style="--k:${COL[t.status] || "#98a1cc"}">${esc(t.status)}</span></div>
    <div class="m">${esc(t.category)} · ${t.shop_name ? "🏪 " + esc(t.shop_name) + " · " : ""}📞 ${esc(t.phone)} · ${new Date(t.created_at).toLocaleString()}</div>
    <div class="d">${esc(t.description)}</div>
    ${t.replies.map(r => `<div class="rp">${esc(r.message)}<small>${r.author === "shop" ? "Shop" : "You"} · ${new Date(r.created_at).toLocaleString()}</small></div>`).join("")}
    <textarea rows="2" placeholder="Write a reply to the customer…" style="margin-top:10px"></textarea>
    <div class="row"><select>${["Open", "In progress", "Resolved"].map(s => `<option ${s === t.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <button data-send>Send / Update</button></div></div>`;
        }
        $("go").onclick = load;
        $("list").addEventListener("click", async e => {
            const b = e.target.closest("[data-send]"); if (!b) return;
            const box = b.closest(".t");
            try {
                await api("/api/admin/tickets/" + box.dataset.id + "/reply", {
                    method: "POST",
                    body: JSON.stringify({ message: box.querySelector("textarea").value, status: box.querySelector("select").value })
                });
                load();
            } catch (err) { alert(err.message); }
        });
    </script>
    <script src="script.js"></script>
    <script src="layout_fix.js"></script>
</body>

</html>
